[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangkok-drainability-observatory"
version = "0.2.1"
description = "Research-grade local observatory for Bangkok / Lower Chao Phraya flood and drainage data (provenance-preserving)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — research use; see README" }
authors = [{ name = "Thammarat (Pound)" }]
dependencies = [
    "streamlit>=1.40",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.7",
    "httpx>=0.27",
    "requests>=2.31",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bdo = "bdo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
